<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>نوای قرآن</title>
  <!-- فونت‌های گوگل برای خط عربی و آیکون‌ها -->
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Amiri:ital,wght@0,400;0,700;1,400&family=Vazirmatn:wght@400;600;700&display=swap">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }

    body {
      font-family: 'Vazirmatn', sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      background-color: #121212;
    }

    /* کانتینر اصلی موبایل با نسبت ابعاد */
    .app-container {
      width: 100%;
      max-width: 420px;
      height: 900px;
      max-height: 100vh;
      position: relative;
      background: linear-gradient(rgba(15, 32, 39, 0.7), rgba(32, 58, 67, 0.7)), 
                  url('https://images.unsplash.com/photo-1584551246679-0daf3d275d0f?q=80&w=1000&auto=format&fit=crop') center/cover no-repeat;
      border-radius: 24px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      box-shadow: 0 20px 50px rgba(0,0,0,0.8);
      border: 1px solid rgba(255, 255, 255, 0.1);
    }

    /* هدر بالای صفحه */
    .app-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 16px 20px;
      background: rgba(255, 255, 255, 0.08);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-bottom: 1px solid rgba(255, 255, 255, 0.15);
      margin: 12px 12px 0 12px;
      border-radius: 16px;
    }

    .app-title {
      color: #ffffff;
      font-size: 22px;
      font-weight: 700;
      text-shadow: 0 2px 4px rgba(0,0,0,0.5);
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .header-actions {
      display: flex;
      gap: 10px;
    }

    .icon-btn {
      width: 40px;
      height: 40px;
      border-radius: 10px;
      background: rgba(255, 255, 255, 0.15);
      border: 1px solid rgba(255, 255, 255, 0.25);
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      font-size: 16px;
      transition: all 0.2s;
    }

    .icon-btn:hover {
      background: rgba(255, 255, 255, 0.25);
    }

    /* تب‌های انتخاب سوره (افکت شیشه‌ای) */
    .tabs-container {
      display: flex;
      justify-content: space-around;
      padding: 0 16px;
      margin-top: 15px;
      gap: 10px;
    }

    .tab-btn {
      flex: 1;
      padding: 10px 0;
      text-align: center;
      background: rgba(255, 255, 255, 0.12);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 12px;
      color: #e0e0e0;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s;
    }

    .tab-btn.active {
      background: rgba(255, 255, 255, 0.25);
      border: 1.5px solid #ffe082;
      color: #ffffff;
      box-shadow: 0 0 12px rgba(255, 224, 130, 0.3);
    }

    /* کادر متن قرآن (طرح فلزی طلایی و نقره‌ای) */
    .quran-card-wrapper {
      padding: 0 20px;
      margin: 15px 0;
      flex: 1;
      display: flex;
      align-items: center;
    }

    .quran-frame {
      width: 100%;
      background: #ffffff;
      border-radius: 16px;
      padding: 12px;
      /* حاشیه فلزی طلایی و نقره‌ای در هم پیچیده */
      border: 8px solid transparent;
      border-image: linear-gradient(135deg, 
        #bf953f 0%, 
        #fcf6ba 25%, 
        #b38728 50%, 
        #fbf5b7 75%, 
        #aa771c 100%) 1;
      box-shadow: 0 0 0 4px #d1d5db, 0 10px 30px rgba(0,0,0,0.5);
      position: relative;
    }

    .quran-inner-border {
      border: 2px solid #c5a059;
      border-radius: 8px;
      padding: 20px 15px;
      text-align: center;
      background-color: #fffdf9;
    }

    .sura-title {
      font-size: 20px;
      font-weight: 700;
      color: #1a1a1a;
      margin-bottom: 12px;
    }

    .bismillah {
      font-family: 'Amiri', serif;
      font-size: 22px;
      color: #2c3e50;
      margin-bottom: 16px;
    }

    .quran-text {
      font-family: 'Amiri', serif;
      font-size: 24px;
      line-height: 2.2;
      color: #111111;
      direction: rtl;
      text-align: center;
    }

    .ayah-num {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 26px;
      height: 26px;
      border: 1px solid #c5a059;
      border-radius: 50%;
      font-size: 13px;
      margin: 0 6px;
      color: #8c6d27;
      font-family: 'Vazirmatn', sans-serif;
    }

    /* نوار ناوبری پایین صفحه */
    .bottom-nav {
      display: flex;
      justify-content: space-around;
      align-items: center;
      background: rgba(20, 25, 30, 0.7);
      backdrop-filter: blur(15px);
      -webkit-backdrop-filter: blur(15px);
      border-top: 1px solid rgba(255, 255, 255, 0.15);
      padding: 12px 10px 16px 10px;
      margin: 0 12px 12px 12px;
      border-radius: 20px;
    }

    .nav-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      color: #a0aec0;
      text-decoration: none;
      font-size: 12px;
      gap: 4px;
      cursor: pointer;
      transition: color 0.2s;
    }

    .nav-item.active, .nav-item:hover {
      color: #ffffff;
    }

    .nav-item i {
      font-size: 18px;
    }
  </style>
</head>
<body>

  <div class="app-container">
    <!-- هدر بالای صفحه -->
    <header class="app-header">
      <div class="app-title">
        <span>نوای قرآن</span>
      </div>
      <div class="header-actions">
        <button class="icon-btn" title="بازگشت"><i class="fa-solid fa-arrow-right"></i></button>
        <button class="icon-btn" title="منو"><i class="fa-solid fa-bars"></i></button>
      </div>
    </header>

    <!-- دکمه‌های انتخاب سوره -->
    <div class="tabs-container">
      <div class="tab-btn">سوره کوثر</div>
      <div class="tab-btn">سوره ناس</div>
      <div class="tab-btn active">سوره اخلاص</div>
    </div>

    <!-- کادر متن آيات قرآن -->
    <div class="quran-card-wrapper">
      <div class="quran-frame">
        <div class="quran-inner-border">
          <div class="sura-title">سوره اخلاص</div>
          <div class="bismillah">بِسْمِ ٱللَّهِ ٱلرَّحْمَٰنِ ٱلرَّحِيمِ</div>
          <div class="quran-text">
            قُلْ هُوَ ٱللَّهُ أَحَدٌ <span class="ayah-num">۱</span>
            ٱللَّهُ ٱلصَّمَدُ <span class="ayah-num">۲</span>
            لَمْ يَلِدْ وَلَمْ يُولَدْ <span class="ayah-num">۳</span>
            وَلَمْ يَكُن لَّهُۥ كُفُوًام أَحَدٌ <span class="ayah-num">۴</span>
          </div>
        </div>
      </div>
    </div>

    <!-- نوار پایین -->
    <nav class="bottom-nav">
      <div class="nav-item">
        <i class="fa-solid fa-bars"></i>
        <span>همبرگری</span>
      </div>
      <div class="nav-item">
        <i class="fa-solid fa-magnifying-glass"></i>
        <span>جستجو</span>
      </div>
      <div class="nav-item active">
        <i class="fa-solid fa-house"></i>
        <span>خانه</span>
      </div>
    </nav>
  </div>

</body>
</html>
