<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>برنامه قرآن کریم</title>
    <!-- فراخوانی فونت قرآنی و فونت فارسی Vazirmatn -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Amiri+Quran&family=Vazirmatn:wght@300;400;700&display=swap" rel="stylesheet">

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Vazirmatn', sans-serif;
            color: #ffffff;
        }

        body {
            min-height: 100vh;
            min-height: -webkit-fill-available;
            background: radial-gradient(circle at center, #1e3c72 0%, #2a5298 50%, #0f172a 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            position: relative;
        }

        /* افکت شیشه‌ای مشترک */
        .glass-panel {
            background: rgba(255, 255, 255, 0.07);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.18);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.4);
            border-radius: 20px;
        }

        .glass-btn {
            background: rgba(255, 255, 255, 0.12);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.25);
            border-radius: 14px;
            color: #ffffff;
            font-size: 1rem;
            font-weight: bold;
            padding: 12px 18px;
            cursor: pointer;
            transition: all 0.3s ease;
            outline: none;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
        }

        .glass-btn:hover, .glass-btn:active {
            background: rgba(255, 255, 255, 0.25);
            border-color: rgba(212, 175, 55, 0.6); /* لمس طلایی هنگام کلیک */
            box-shadow: 0 0 15px rgba(212, 175, 55, 0.3);
        }

        /* صفحات */
        .page {
            position: absolute;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.4s ease;
            padding: 20px;
            padding-bottom: calc(25px + env(safe-area-inset-bottom)); /* جلوگیری از تداخل با نوار پایین گوشی */
        }

        .page.active {
            opacity: 1;
            pointer-events: auto;
        }

        /* صفحه اصلی */
        #home-page {
            justify-content: center;
        }

        #home-page h1 {
            font-size: 2.2rem;
            margin-bottom: 30px;
            text-shadow: 0 4px 15px rgba(0,0,0,0.5);
            text-align: center;
        }

        /* دکمه بازگشت بالا سمت راست */
        .back-btn {
            position: absolute;
            top: max(20px, env(safe-area-inset-top));
            right: 20px;
            font-size: 0.9rem;
            padding: 8px 18px;
            z-index: 10;
        }

        /* کادر اسلیمی و مذهبی نمایش سوره */
        .surah-display {
            width: 100%;
            max-width: 500px;
            margin-top: 60px;
            margin-bottom: 15px;
            padding: 25px 20px;
            text-align: center;
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            overflow-y: auto;
            position: relative;
            
            /* حاشیه اسلیمی دو لایه و شیک */
            border: 2px solid rgba(212, 175, 55, 0.4);
            outline: 4px solid rgba(255, 255, 255, 0.05);
            outline-offset: -8px;
            box-shadow: inset 0 0 20px rgba(212, 175, 55, 0.1), 0 10px 30px rgba(0,0,0,0.5);
        }

        /* گل‌های اسلیمی در گوشه‌های کادر */
        .surah-display::before, .surah-display::after {
            content: "✦";
            position: absolute;
            color: rgba(212, 175, 55, 0.7);
            font-size: 1.2rem;
        }

        .surah-display::before { top: 6px; right: 10px; }
        .surah-display::after { bottom: 6px; left: 10px; }

        .surah-title {
            font-size: 1.6rem;
            margin-bottom: 15px;
            border-bottom: 1px dashed rgba(212, 175, 55, 0.4);
            padding-bottom: 8px;
            width: 80%;
            color: #f1e5ac;
            text-shadow: 0 2px 8px rgba(0,0,0,0.4);
        }

        /* متن قرآنی */
        .quran-text {
            font-family: 'Amiri Quran', serif;
            font-size: 1.7rem;
            line-height: 2.4;
            color: #ffffff;
            text-shadow: 0 2px 6px rgba(0,0,0,0.6);
            word-spacing: 3px;
        }

        /* نوار پایین دکمه‌ها */
        .bottom-nav {
            width: 100%;
            max-width: 500px;
            display: flex;
            justify-content: space-around;
            gap: 8px;
            padding: 12px;
            border: 1px solid rgba(212, 175, 55, 0.3);
            margin-bottom: 10px; /* ایجاد فاصله ایمن از پایین */
        }

        .bottom-nav button {
            flex: 1;
            font-size: 0.95rem;
            padding: 12px 6px;
            white-space: nowrap;
        }

        @media (max-width: 480px) {
            .quran-text { font-size: 1.4rem; line-height: 2.1; }
            .bottom-nav button { font-size: 0.85rem; padding: 10px 4px; }
            .surah-title { font-size: 1.3rem; }
        }
    </style>
</head>
<body>

    <!-- صفحه اصلی (ورود) -->
    <div id="home-page" class="page active">
        <h1>برنامه قرآن کریم</h1>
        <button class="glass-btn" style="padding: 14px 40px; font-size: 1.2rem; border-color: rgba(212,175,55,0.5);" onclick="navigateToApp()">ورود به برنامه</button>
    </div>

    <!-- صفحه نمایش سوره و منو -->
    <div id="app-page" class="page">
        <!-- دکمه بازگشت بالا سمت راست -->
        <button class="glass-btn back-btn" onclick="navigateToHome()">← بازگشت</button>

        <!-- محل نمایش سوره با کادر اسلیمی -->
        <div class="surah-display glass-panel">
            <h2 id="surah-title" class="surah-title">لطفاً یک سوره را انتخاب کنید</h2>
            <div id="surah-content" class="quran-text">
                جهت مشاهده متن سوره، از دکمه‌های زیر استفاده نمایید.
            </div>
        </div>

        <!-- دکمه‌های شیشه‌ای پایین صفحه -->
        <div class="bottom-nav glass-panel">
            <button class="glass-btn" onclick="showSurah('kawthar')">سوره کوثر</button>
            <button class="glass-btn" onclick="showSurah('nas')">سوره ناس</button>
            <button class="glass-btn" onclick="showSurah('ikhlas')">سوره اخلاص</button>
        </div>
    </div>

                content: "بِسْمِ اللَّهِ الرَّحْمَٰنِ الرَّحِيمِ <br> قُلْ هُوَ اللَّهُ أَ
