<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>برنامه قرآن کریم</title>
    <!-- فراخوانی فونت قرآنی و فونت فارسی Vazirmatn از گوگل فونتس -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Amiri+Quran&family=Vazirmatn:wght@300;400;700&display=swap" rel="stylesheet">

    <style>
        /* تنظیمات کلی صفحه */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Vazirmatn', sans-serif;
            color: #ffffff; /* رنگ همه فونت‌ها سفید */
        }

        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #0f2027, #203a43, #2c5364); /* پس‌زمینه زنده و زیبا */
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            position: relative;
        }

        /* افکت شیشه‌ای مشترک (Glassmorphism) */
        .glass-panel {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
            border-radius: 20px;
        }

        .glass-btn {
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.3);
            border-radius: 15px;
            color: #ffffff;
            font-size: 1.1rem;
            font-weight: bold;
            padding: 12px 24px;
            cursor: pointer;
            transition: all 0.3s ease;
            outline: none;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
        }

        .glass-btn:hover {
            background: rgba(255, 255, 255, 0.3);
            border-color: rgba(255, 255, 255, 0.5);
            transform: translateY(-3px);
            box-shadow: 0 6px 20px rgba(255, 255, 255, 0.2);
        }

        .glass-btn:active {
            transform: translateY(0);
        }

        /* صفحات */
        .page {
            position: absolute;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.5s ease;
            padding: 20px;
        }

        .page.active {
            opacity: 1;
            pointer-events: auto;
        }

        /* صفحه اصلی */
        #home-page h1 {
            font-size: 2.5rem;
            margin-bottom: 30px;
            text-shadow: 0 2px 10px rgba(0,0,0,0.3);
        }

        /* صفحه اصلی برنامه‌/سوره‌ها */
        #app-page {
            justify-content: space-between;
        }

        /* دکمه بازگشت بالا سمت راست */
        .back-btn {
            position: absolute;
            top: 20px;
            right: 20px;
            font-size: 0.9rem;
            padding: 8px 18px;
        }

        /* نمایش متن سوره */
        .surah-display {
            width: 90%;
            max-width: 600px;
            margin-top: 70px;
            margin-bottom: 20px;
            padding: 30px;
            text-align: center;
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            overflow-y: auto;
        }

        .surah-title {
            font-size: 1.8rem;
            margin-bottom: 20px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.2);
            padding-bottom: 10px;
            width: 100%;
        }

        /* فونت قرآنی برای متن سوره */
        .quran-text {
            font-family: 'Amiri Quran', serif;
            font-size: 1.8rem;
            line-height: 2.5;
            color: #ffffff;
            text-shadow: 0 2px 5px rgba(0,0,0,0.5);
            word-spacing: 4px;
        }

        /* منوی پایین برای دکمه‌های سوره */
        .bottom-nav {
            width: 90%;
            max-width: 600px;
            display: flex;
            justify-content: space-around;
            gap: 10px;
            padding: 15px;
            margin-bottom: 10px;
        }

        .bottom-nav button {
            flex: 1;
            font-size: 1rem;
            padding: 12px 5px;
        }

        /* پاسخگویی در موبایل */
        @media (max-width: 480px) {
            .quran-text { font-size: 1.4rem; line-height: 2.2; }
            .bottom-nav button { font-size: 0.85rem; }
            .back-btn { top: 15px; right: 15px; }
        }
    </style>
</head>
<body>

    <!-- صفحه اصلی (ورود) -->
    <div id="home-page" class="page active">
        <h1>به نرم‌افزار قرآنی خوش آمدید</h1>
        <button class="glass-btn" onclick="navigateToApp()">ورود به برنامه</button>
    </div>

    <!-- صفحه نمایش سوره و منو -->
    <div id="app-page" class="page">
        <!-- دکمه بازگشت در بالا سمت راست -->
        <button class="glass-btn back-btn" onclick="navigateToHome()">← بازگشت</button>

        <!-- محل نمایش سوره -->
        <div class="surah-display glass-panel">
            <h2 id="surah-title" class="surah-title">لطفاً یک سوره را انتخاب کنید</h2>
            <div id="surah-content" class="quran-text">
                برای مشاهده متن سوره، روی یکی از دکمه‌های زیر کلیک کنید.
            </div>
        </div>

        <!-- دکمه‌های شیشه‌ای پایین صفحه -->
        <div class="bottom-nav glass-panel">
            <button class="glass-btn" onclick="showSurah('kawthar')">سوره کوثر</button>
            <button class="glass-btn" onclick="showSurah('nas')">سوره ناس</button>
            <button class="glass-btn" onclick="showSurah('ikhlas')">سوره اخلاص</button>
        </div>
    </div>

    <script>
        // اطلاعات سوره‌ها
        const surahs = {
            kawthar: {
                title: "سورة الْكَوْثَر",
                content: "بِسْمِ اللَّهِ الرَّحْمَٰنِ الرَّحِيمِ <br> إِنَّا أَعْطَيْنَاكَ الْكَوْثَرَ ﴿١﴾ فَصَلِّ لِرَبِّكَ وَانْحَرْ ﴿٢﴾ إِنَّ شَانِئَكَ هُوَ الْأَبْتَرُ ﴿٣﴾"
            },
            nas: {
                title: "سورة النَّاس",
                content: "بِسْمِ اللَّهِ الرَّحْمَٰنِ الرَّحِيمِ <br> قُلْ أَعُوذُ بِرَبِّ النَّاسِ ﴿١﴾ مَلِكِ النَّاسِ ﴿٢﴾ إِلَٰهِ النَّاسِ ﴿٣﴾ مِنْ شَرِّ الْوَسْوَاسِ الْخَنَّاسِ ﴿٤﴾ الَّذِي يُوَسْوِسُ فِي صُدُورِ النَّاسِ ﴿٥﴾ مِنَ الْجِنَّةِ وَالنَّاسِ ﴿٦﴾"
            },
            ikhlas: {
                title: "سورة الإِخْلَاص",
                content: "بِسْمِ اللَّهِ الرَّحْمَٰنِ الرَّحِيمِ <br> قُلْ هُوَ اللَّهُ أَحَدٌ ﴿١﴾ اللَّهُ الصَّمَدُ ﴿٢﴾ لَمْ يَلِدْ وَلَمْ يُولَدْ ﴿٣﴾ وَلَمْ يَكُنْ لَهُ كُفُوًا أَحَدٌ ﴿٤﴾"
            }
        };

        // رفتن به صفحه اصلی برنامه
        function navigateToApp() {
            document.getElementById('home-page').classList.remove('active');
            document.getElementById('app-page').classList.add('active');
        }

        // بازگشت به صفحه اول (صفحه ورود)
        function navigateToHome() {
            document.getElementById('app-page').classList.remove('active');
            document.getElementById('home-page').classList.add('active');
        }

        // نمایش سوره انتخاب شده
        function showSurah(key) {
            const surah = surahs[key];
            document.getElementById('surah-title').innerText = surah.title;
            document.getElementById('surah-content').innerHTML = surah.content;
        }
    </script>
</body>
</html>
